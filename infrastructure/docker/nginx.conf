server {
    listen 8080;
    include /etc/nginx/studio.d/*.conf;
    server_tokens off;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; frame-src https://www.youtube-nocookie.com https://player.twitch.tv https://clips.twitch.tv; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    location /api/ {
        if ($http_range ~ ",") { return 416; }
        access_log off;
        client_max_body_size 4g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 1900s;
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8000;
        proxy_pass $api$request_uri;
    }
    location / { try_files $uri $uri/ /index.html; }
}
