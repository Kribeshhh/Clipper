[project]
name = "gaming-clipper-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn>=0.38,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "celery[redis]>=5.5,<6",
  "cryptography>=45,<51",
  "dnspython>=2.7,<3",
]
[dependency-groups]
analysis = [
    "faster-whisper>=1.2,<2",
    "numpy>=2.2,<3",
    "opencv-python-headless>=4.11,<5",
]
dev = ["httpx2>=2,<3", "pytest>=8,<10", "ruff>=0.14,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
